name: Assign Azure RBAC Roles

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Display name, App ID (clientId), or Object ID of the target service principal"
        required: true
        type: string
      role_foundry_user:
        description: "Foundry User"
        type: boolean
        default: false
      role_cognitive_services_openai_user:
        description: "Cognitive Services OpenAI User"
        type: boolean
        default: false
      role_search_index_data_contributor:
        description: "Search Index Data Contributor"
        type: boolean
        default: false
      role_search_service_contributor:
        description: "Search Service Contributor"
        type: boolean
        default: false
      dry_run:
        description: "Preview role changes without creating any assignments"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: azure-rbac-${{ inputs.app_name }}
  cancel-in-progress: false

jobs:
  assign-roles:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve principal object ID
        id: resolve
        run: |
          set -euo pipefail
          APP_NAME="${{ inputs.app_name }}"
          GUID_RE='^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'

          if [[ "$APP_NAME" =~ $GUID_RE ]]; then
            if OBJECT_ID=$(az ad sp show --id "$APP_NAME" --query id -o tsv 2>/dev/null) && [[ -n "$OBJECT_ID" ]]; then
              :
            else
              OBJECT_ID=$(az ad sp list --filter "appId eq '$APP_NAME'" --query "[0].id" -o tsv)
            fi
          else
            OBJECT_ID=$(az ad sp list --display-name "$APP_NAME" --query "[0].id" -o tsv)
          fi

          if [[ -z "$OBJECT_ID" || "$OBJECT_ID" == "null" ]]; then
            echo "::error::Could not resolve a service principal for '$APP_NAME'."
            exit 1
          fi

          echo "Resolved '$APP_NAME' -> $OBJECT_ID"
          echo "object_id=$OBJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Reconcile role assignments
        env:
          OBJECT_ID: ${{ steps.resolve.outputs.object_id }}
          SCOPE: ${{ vars.AZURE_ROLE_SCOPE }}
          DRY_RUN: ${{ inputs.dry_run }}
          ROLE_FOUNDRY_USER: ${{ inputs.role_foundry_user }}
          ROLE_COGNITIVE_SERVICES_OPENAI_USER: ${{ inputs.role_cognitive_services_openai_user }}
          ROLE_SEARCH_INDEX_DATA_CONTRIBUTOR: ${{ inputs.role_search_index_data_contributor }}
          ROLE_SEARCH_SERVICE_CONTRIBUTOR: ${{ inputs.role_search_service_contributor }}
        run: |
          set -euo pipefail

          if [[ -z "$SCOPE" ]]; then
            echo "::error::Repository variable AZURE_ROLE_SCOPE is not set."
            exit 1
          fi

          ROLES=()
          [[ "$ROLE_FOUNDRY_USER" == "true" ]] && ROLES+=("Foundry User")
          [[ "$ROLE_COGNITIVE_SERVICES_OPENAI_USER" == "true" ]] && ROLES+=("Cognitive Services OpenAI User")
          [[ "$ROLE_SEARCH_INDEX_DATA_CONTRIBUTOR" == "true" ]] && ROLES+=("Search Index Data Contributor")
          [[ "$ROLE_SEARCH_SERVICE_CONTRIBUTOR" == "true" ]] && ROLES+=("Search Service Contributor")

          if [[ ${#ROLES[@]} -eq 0 ]]; then
            echo "::error::No roles selected."
            exit 1
          fi

          echo "| Role | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"

          for ROLE in "${ROLES[@]}"; do
            if ! az role definition list --name "$ROLE" --query "[0].name" -o tsv | grep -q .; then
              echo "::error::Unknown role definition '$ROLE'."
              echo "| $ROLE | ❌ unknown role |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            EXISTING=$(az role assignment list --assignee-object-id "$OBJECT_ID" --scope "$SCOPE" --role "$ROLE" --query "[0].id" -o tsv)

            if [[ -n "$EXISTING" ]]; then
              echo "'$ROLE' already assigned, skipping"
              echo "| $ROLE | already assigned |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[dry-run] would assign '$ROLE'"
              echo "| $ROLE | would assign (dry-run) |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            az role assignment create \
              --assignee-object-id "$OBJECT_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "$ROLE" \
              --scope "$SCOPE"
            echo "assigned '$ROLE'"
            echo "| $ROLE | assigned |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Sync current assignments to pinned issue
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ vars.AZURE_ROLE_SCOPE }}
        run: |
          set -euo pipefail

          CATALOG_ROLES=("Foundry User" "Cognitive Services OpenAI User" "Search Index Data Contributor" "Search Service Contributor")

          FILTER=""
          for ROLE in "${CATALOG_ROLES[@]}"; do
            [[ -n "$FILTER" ]] && FILTER+=" || "
            FILTER+="roleDefinitionName=='${ROLE}'"
          done

          ASSIGNMENTS_JSON="$(az role assignment list --scope "$SCOPE" --query "[?${FILTER}]" -o json)"

          {
            echo "# Current Azure RBAC Delegated Role Assignments"
            echo
            echo "Auto-generated by [assign-azure-rbac.yaml](${{ github.server_url }}/${{ github.repository }}/actions/workflows/assign-azure-rbac.yaml). Do not edit by hand — changes are overwritten on the next run."
            echo
            echo "Last synced: $(date -u '+%Y-%m-%d %H:%M:%S UTC') · [Triggering run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "| Principal | Object ID | Role |"
            echo "|-----------|-----------|------|"
          } > assignments-body.md

          echo "$ASSIGNMENTS_JSON" | jq -r '.[] | [.principalId, .roleDefinitionName] | @tsv' | while IFS=$'\t' read -r PRINCIPAL_ID ROLE; do
            DISPLAY_NAME="$(az ad sp show --id "$PRINCIPAL_ID" --query displayName -o tsv 2>/dev/null || echo "(unresolved)")"
            echo "| ${DISPLAY_NAME} | \`${PRINCIPAL_ID}\` | ${ROLE} |" >> assignments-body.md
          done

          gh label create rbac-state --description "Tracks the auto-synced Azure RBAC assignments issue" --color "0E8A16" 2>/dev/null || true

          ISSUE_NUM="$(gh issue list --label rbac-state --state open --json number --jq '.[0].number' || true)"

          if [[ -z "$ISSUE_NUM" ]]; then
            ISSUE_NUM="$(gh issue create --title "Current Azure RBAC Delegated Role Assignments" --label rbac-state --body-file assignments-body.md --json number --jq '.number')"
            gh issue pin "$ISSUE_NUM" || echo "::warning::Could not pin issue #$ISSUE_NUM — pin it manually."
            echo "Created and pinned issue #$ISSUE_NUM"
          else
            gh issue edit "$ISSUE_NUM" --body-file assignments-body.md
            echo "Updated issue #$ISSUE_NUM"
          fi
