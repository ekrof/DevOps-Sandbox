name: Assign Azure RBAC Roles

# DISPATCH-FORM PREVIEW of the new assign-azure-rbac.yaml in AkerBP/dig-ai-foundation (PR #2334).
# The `on:` block below is a verbatim copy, so "Run workflow" shows the form as it will look once
# that PR merges. This copy makes no Azure calls: it validates the inputs the same way and writes
# what a real run would do to the job summary.
#
# The earlier Azure-backed sandbox version of this workflow is in git history (cc41eb4).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - dev
          - test
          - prod
          - sbox
          - stest
          - sprod
      app_name:
        description: "Object ID of the service principal"
        type: string
        required: true
      role_foundry_user:
        description: "Foundry User (Foundry project scope)"
        type: boolean
        default: false
      role_search_index_data_contributor:
        description: "Search Index Data Contributor (AI Search service scope)"
        type: boolean
        default: false
      role_cognitive_services_openai_user:
        description: "Cognitive Services OpenAI User (Foundry account scope)"
        type: boolean
        default: false
      role_cognitive_services_user:
        description: "Cognitive Services User (Foundry account scope)"
        type: boolean
        default: false
      role_search_service_contributor:
        description: "Search Service Contributor (AI Search service scope)"
        type: boolean
        default: false
      role_reader:
        description: "Reader (AI Search service scope)"
        type: boolean
        default: false
      role_monitoring_reader:
        description: "Monitoring Reader (Application Insights scope)"
        type: boolean
        default: false
      role_log_analytics_reader:
        description: "Log Analytics Reader (Log Analytics workspace scope)"
        type: boolean
        default: false
      role_search_index_data_reader:
        description: "Search Index Data Reader (single index scope — requires index_name)"
        type: boolean
        default: false
      index_name:
        description: "AI Search index name (required only when role_search_index_data_reader is checked)"
        type: string
        required: false
      remove_roles:
        description: "REMOVE the checked roles from the principal instead of assigning them"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Show what this run would do
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          APP_NAME: ${{ inputs.app_name }}
          INDEX_NAME: ${{ inputs.index_name }}
          REMOVE_ROLES: ${{ inputs.remove_roles }}
          ROLE_FOUNDRY_USER: ${{ inputs.role_foundry_user }}
          ROLE_SEARCH_INDEX_DATA_CONTRIBUTOR: ${{ inputs.role_search_index_data_contributor }}
          ROLE_COGNITIVE_SERVICES_OPENAI_USER: ${{ inputs.role_cognitive_services_openai_user }}
          ROLE_COGNITIVE_SERVICES_USER: ${{ inputs.role_cognitive_services_user }}
          ROLE_SEARCH_SERVICE_CONTRIBUTOR: ${{ inputs.role_search_service_contributor }}
          ROLE_READER: ${{ inputs.role_reader }}
          ROLE_MONITORING_READER: ${{ inputs.role_monitoring_reader }}
          ROLE_LOG_ANALYTICS_READER: ${{ inputs.role_log_analytics_reader }}
          ROLE_SEARCH_INDEX_DATA_READER: ${{ inputs.role_search_index_data_reader }}
        shell: bash
        run: |
          set -euo pipefail
          GUID_RE='^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'
          if [[ ! "$APP_NAME" =~ $GUID_RE ]]; then
            echo "::error::'$APP_NAME' is not a GUID. Pass the object ID of the service principal."
            exit 1
          fi
          declare -A SCOPE
          ROLES=()
          add() { ROLES+=("$1"); SCOPE["$1"]="$2"; }

          [[ "$ROLE_FOUNDRY_USER" == "true" ]] && add "Foundry User" "Foundry project"
          [[ "$ROLE_SEARCH_INDEX_DATA_CONTRIBUTOR" == "true" ]] && add "Search Index Data Contributor" "AI Search service"
          [[ "$ROLE_COGNITIVE_SERVICES_OPENAI_USER" == "true" ]] && add "Cognitive Services OpenAI User" "Foundry account"
          [[ "$ROLE_COGNITIVE_SERVICES_USER" == "true" ]] && add "Cognitive Services User" "Foundry account"
          [[ "$ROLE_SEARCH_SERVICE_CONTRIBUTOR" == "true" ]] && add "Search Service Contributor" "AI Search service"
          [[ "$ROLE_READER" == "true" ]] && add "Reader" "AI Search service"
          [[ "$ROLE_MONITORING_READER" == "true" ]] && add "Monitoring Reader" "Application Insights"
          [[ "$ROLE_LOG_ANALYTICS_READER" == "true" ]] && add "Log Analytics Reader" "Log Analytics workspace"
          if [[ "$ROLE_SEARCH_INDEX_DATA_READER" == "true" ]]; then
            if [[ -z "$INDEX_NAME" ]]; then
              echo "::error::role_search_index_data_reader is checked but index_name is empty."
              exit 1
            fi
            add "Search Index Data Reader" "index $INDEX_NAME"
          fi

          if [[ ${#ROLES[@]} -eq 0 ]]; then
            echo "::error::No roles selected."
            exit 1
          fi

          if [[ "$REMOVE_ROLES" == "true" ]]; then ACTION="would REMOVE"; else ACTION="would assign"; fi

          {
            echo "### Preview (no Azure calls)"
            echo
            echo "- Environment: \`$ENVIRONMENT\`"
            echo "- Principal object ID: \`${APP_NAME,,}\`"
            if [[ "$REMOVE_ROLES" == "true" ]]; then echo "- Mode: **REMOVE** — checked roles are revoked, not assigned"; fi
            echo
            echo "| Role | Scope | Action |"
            echo "|------|-------|--------|"
            for ROLE in "${ROLES[@]}"; do
              echo "| $ROLE | ${SCOPE[$ROLE]} | $ACTION |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
