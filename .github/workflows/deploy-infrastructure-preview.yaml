name: Deploy Infrastructure (preview)

# Mirrors cd-deploy-infra.yaml in AkerBP/dig-ai-foundation (PR #2406) against a test tenant.
# Infrastructure is promoted from master only:
#   dev -> test, stest -> prod, sprod
# Every stage deploys the same commit and starts only after the previous one succeeded.
# test, stest, prod and sprod are handled the same way: they plan in an ungated <env>-plan
# environment, then pause before apply for required reviewers, who read the plan summary first.
# The apply uses the saved plan. No resource changes in a plan: apply and approval are skipped. A newer merge supersedes a run still waiting for approval.
# sbox is not part of promotion.
#
# Only a push to master (a merged PR) can start it: the repository Actions policy
# "infra deploys only from merges" allows the push event only. To retry, re-run failed jobs;
# to roll back, revert the PR.

on:
  push:
    branches:
      - master
    paths:
      - "infrastructure/**"
      - "config-*.yaml"

permissions:
  id-token: write
  contents: read

jobs:
  promote-dev:
    uses: ./.github/workflows/template-terraform-preview.yaml
    with:
      environment: dev
      ref: ${{ github.sha }}

  promote-test:
    needs: promote-dev
    strategy:
      matrix:
        environment: [test, stest]
    uses: ./.github/workflows/template-terraform-preview.yaml
    with:
      environment: ${{ matrix.environment }}
      plan_environment: ${{ matrix.environment }}-plan
      ref: ${{ github.sha }}

  promote-prod:
    needs: promote-test
    strategy:
      matrix:
        environment: [prod, sprod]
    uses: ./.github/workflows/template-terraform-preview.yaml
    with:
      environment: ${{ matrix.environment }}
      plan_environment: ${{ matrix.environment }}-plan
      ref: ${{ github.sha }}
