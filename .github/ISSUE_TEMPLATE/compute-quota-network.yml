name: "🖥️ Compute / Quota / Network Change"
description: "Changes your team cannot make within the workspace's permissions or limits"
title: "Change: "
labels: ["service-request", "request:compute-quota-network"]

body:
  - type: input
    id: workspace
    attributes:
      label: "Workspace"
      placeholder: "dig-aml-anomdet-sc"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      options: [dev, test, prod]
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: "Region"
      options: [swedencentral, westeurope, other]
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: "Change"
      description: What needs to change and why.
    validations:
      required: true

  - type: textarea
    id: workload
    attributes:
      label: "Workload"
      description: Which job or service is affected.

  - type: textarea
    id: compute
    attributes:
      label: "Compute / quota"
      description: VM size or family, current usage/limit and requested limit.

  - type: textarea
    id: network
    attributes:
      label: "Network"
      description: What needs to connect to what — source, destination and port if known.

  - type: textarea
    id: errors
    attributes:
      label: "Errors"
      render: text

  - type: input
    id: cost
    attributes:
      label: "Cost"
      description: Expected cost impact, if known.
