name: "🖥️ Compute / Quota / Network Change"
description: "New or changed compute clusters, quota increases, network access"
title: "Change: "
labels: ["service-request", "request:compute-quota-network"]

body:
  - type: input
    id: workspace
    attributes:
      label: "Workspace"
      description: Folder name in `workspaces/`, not the Azure ML workspace name.
      placeholder: "dig-aml-anomdet-sc"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      options: [dev, test, prod]
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: "Region"
      options: [swedencentral, westeurope, other]
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: "Change"
      description: What needs to change and why.
    validations:
      required: true

  - type: textarea
    id: workload
    attributes:
      label: "Workload"
      description: Which job or service is affected.

  - type: textarea
    id: compute
    attributes:
      label: "Compute / quota"
      description: |
        New or changed cluster: name, VM size, min/max nodes.
        Quota: VM family, current usage/limit and requested limit.
      placeholder: |
        - name: orchestration-cluster
          vm_size: Standard_D2s_v3
          min_nodes: 0
          max_nodes: 2

  - type: input
    id: identity
    attributes:
      label: "Identity"
      description: Managed identity the cluster should use, if not the workspace default cluster identity.
      placeholder: "umi-cluster-<app>-dev"

  - type: textarea
    id: network
    attributes:
      label: "Network"
      description: What needs to connect to what — source, destination and port if known.

  - type: textarea
    id: errors
    attributes:
      label: "Errors"
      render: text

  - type: input
    id: cost
    attributes:
      label: "Cost"
      description: Expected cost impact, if known.
