name: "🐙 GitHub Actions Azure Access"
description: "Add, change or remove a repository's Azure access to a workspace"
title: "GitHub Actions access: "
labels: ["service-request", "request:github-actions-access"]

body:
  - type: markdown
    attributes:
      value: |
        Workflows sign in to Azure with a user-assigned managed identity (UMI) — no secrets.
        MLOps configures which repository and GitHub environment or branch can use it.
        Dev/test bind to the GitHub `development` environment, prod binds to `main`.

        Approved **Add** requests are turned into a pull request automatically.
        See [platform service requests](https://github.com/AkerBP/dig-mlops-workspaces/blob/main/docs/roadmap/platform-service-requests.md#azure-access-for-github-actions).

  - type: input
    id: workspace
    attributes:
      label: "Workspace"
      description: Workspace folder name in `workspaces/`.
      placeholder: "dig-aml-anomdet-sc"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      options: [dev, test, prod]
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: "Repository"
      placeholder: "AkerBP/my-ml-project"
    validations:
      required: true

  - type: dropdown
    id: change
    attributes:
      label: "Change"
      options:
        - Add
        - Change permissions
        - Remove
    validations:
      required: true

  - type: checkboxes
    id: roles
    attributes:
      label: "Roles"
      description: What the repository needs. Not needed for removal.
      options:
        - label: "AzureML Data Scientist"
        - label: "AzureML Compute Operator"
        - label: "AcrPush"
        - label: "Key Vault Secrets Officer"
        - label: "Reader"
        - label: "Storage Blob Data Contributor"

  - type: input
    id: identity
    attributes:
      label: "Identity"
      description: Existing UMI name or client ID, if known.

  - type: textarea
    id: reason
    attributes:
      label: "Reason"
    validations:
      required: true
