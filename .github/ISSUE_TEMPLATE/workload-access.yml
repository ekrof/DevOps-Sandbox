name: "🪪 Workload Azure Access"
description: "Azure access for a job, endpoint or application via a managed identity"
title: "Workload access: "
labels: ["service-request", "request:workload-access"]

body:
  - type: markdown
    attributes:
      value: |
        Access for a cluster, endpoint or application UMI, including resources outside
        the workspace. The target service must support managed identity authentication.
        MLOps identifies the right UMI and coordinates access.

  - type: input
    id: workspace
    attributes:
      label: "Workspace"
      placeholder: "dig-aml-anomdet-sc"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      options: [dev, test, prod]
    validations:
      required: true

  - type: textarea
    id: workload
    attributes:
      label: "Workload"
      description: Which job, endpoint or application needs access, and where it runs.
    validations:
      required: true

  - type: input
    id: identity
    attributes:
      label: "Identity"
      description: Existing UMI name or client ID, if known.

  - type: textarea
    id: resource
    attributes:
      label: "Resource"
      description: Name or link to the target resource, e.g. storage container, Key Vault, model endpoint.
    validations:
      required: true

  - type: textarea
    id: permissions
    attributes:
      label: "Permissions"
      description: What it needs to do, e.g. read data or call an endpoint.
    validations:
      required: true

  - type: dropdown
    id: change
    attributes:
      label: "Change"
      options:
        - Add access
        - Change access
        - Remove access
        - New identity
    validations:
      required: true

  - type: input
    id: expiry
    attributes:
      label: "Expiry"
      description: End date if temporary (`YYYY-MM-DD`).
      placeholder: "2026-12-31"
