name: "🔑 Workspace Access"
description: "Change group owners or fix access to a private workspace"
title: "Access: "
labels: ["service-request", "request:workspace-access"]

body:
  - type: markdown
    attributes:
      value: |
        Group owners manage workspace membership themselves. Use this form to change
        group owners or resolve access issues they cannot handle.

        For the internal model catalog, use the
        [Catalog Access](https://github.com/ekrof/DevOps-Sandbox/issues/new?template=catalog-access.yml) form.
        See [platform service requests](https://github.com/AkerBP/dig-mlops-workspaces/blob/main/docs/roadmap/platform-service-requests.md).

  - type: input
    id: workspace
    attributes:
      label: "Workspace"
      description: Workspace folder name in `workspaces/`.
      placeholder: "dig-aml-anomdet-sc"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      options: [dev, test, prod]
    validations:
      required: true

  - type: input
    id: user
    attributes:
      label: "User"
      description: Admin account sign-in name.
      placeholder: "admin.john.doe@akerbp.com"
    validations:
      required: true

  - type: input
    id: group
    attributes:
      label: "Group"
      description: AD group name, if known.
      placeholder: "sg-dig-aml-anomdet-dev-sc-admin"

  - type: textarea
    id: change
    attributes:
      label: "Change"
      description: What access or group ownership should change.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: "Reason"
    validations:
      required: true

  - type: input
    id: expiry
    attributes:
      label: "Expiry"
      description: End date if temporary (`YYYY-MM-DD`). MLOps is reminded to remove access after this date.
      placeholder: "2026-12-31"
