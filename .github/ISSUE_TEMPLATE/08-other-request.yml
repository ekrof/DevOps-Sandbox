name: "💬 Other Request or Question"
description: "Online endpoints in your workspace, questions, or anything no other form covers"
title: "Request: "
labels: ["service-request", "request:other"]

body:
  - type: input
    id: workspace
    attributes:
      label: "Workspace"
      description: If it concerns a workspace.
      placeholder: "dig-aml-anomdet-sc"

  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      options: [dev, test, prod, "n/a"]

  - type: textarea
    id: request
    attributes:
      label: "Request"
      description: What you need and why.
    validations:
      required: true
